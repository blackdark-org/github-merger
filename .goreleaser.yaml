version: 2

builds:
  - main: ./cmd/github-merger
    binary: github-merger
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]

sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  # A tag push can start this workflow twice. The second upload gets HTTP 422
  # because the asset name already exists. Delete that asset and upload again.
  replace_existing_artifacts: true
