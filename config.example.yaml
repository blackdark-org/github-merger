interval: 60s
settle: 60s
# 0 never merges a pull request that has no check runs.
merge_without_checks_after: 0s
# Set org or repos. org watches every repository the app installation can access.
# org: owner
repos:
  - owner/name
default_merge_method: merge
labels:
  require:
    - automerge
  block: []
  squash: squash
